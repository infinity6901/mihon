name: Setup Android Build

description: Sets up JDK (from .github/.java-version) and Gradle for Mihon CI jobs.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version-file: .github/.java-version
        distribution: temurin

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: true
